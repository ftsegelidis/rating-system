# Optional: copy .env.example to .env and set strong passwords.
# Compose also interpolates variables from a project-root .env file if present.
services:
  service:
    image: docker-spring-boot-rating:latest
    build:
      context: .
    container_name: rating-service
    depends_on:
      - pgdbrating
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgdbrating:5432/${POSTGRES_DB:-ratingservice}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SPRING_PROFILES_ACTIVE: production
    ports:
      - "8080:8080"

  pgdbrating:
    image: postgres:16-alpine
    container_name: pgdbrating
    ports:
      - "5432:5432"
    volumes:
      - postgres_rating:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ratingservice}
      PGDATA: /var/lib/postgresql/data/pgdata

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-changeme}
      PGADMIN_LISTEN_PORT: "80"
    ports:
      - "15432:80"
    depends_on:
      - pgdbrating

volumes:
  postgres_rating:
    driver: local
